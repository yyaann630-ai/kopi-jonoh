<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Kopi Jonoh</title>
<script src="/theme.js"></script><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head>
<body><header class="top"><div class="brand">Kopi Jonoh<i>.</i> <small>Kasir</small></div><div class="hr"><button class="g s" data-theme-btn></button><div class="row" id="hd" hidden><button class="g s" id="bell"></button><button class="g s" onclick="out()">Keluar</button></div></div></header>
<div class="ad"><div id="login" hidden class="lg"><div class="sb" style="font-size:64px">🔐</div><h2 style="font-size:28px;text-align:center">Masuk kasir</h2><form id="lf" onsubmit="return login(event)"><label for="pw">Password</label><div class="row"><input class="fl" id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go"><button type="button" class="g s" id="eye">Lihat</button></div><p class="err" id="er"></p><button id="lb" style="width:100%">Masuk</button></form></div>
<div id="app" hidden><nav class="nav" id="nav"></nav><div id="pane"></div></div></div>
<dialog id="dlg"><h2 id="dt" style="font-size:24px"></h2><label for="mn">Nama menu</label><input id="mn"><label for="mp">Harga (Rp)</label><input id="mp" type="number" min="0"><label for="me">Emoji</label><input id="me" maxlength="4"><label for="mc">Kategori</label><select id="mc"></select><div class="row" style="margin-top:18px"><button class="g" onclick="dlg.close()">Batal</button><button class="fl" onclick="saveM()">Simpan</button></div></dialog>
<script src="/sfx.js"></script><script>
const $=s=>document.querySelector(s),f=n=>'Rp '+n.toLocaleString('id-ID'),e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=t=>new Date(t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const api=(u,m='GET',b)=>fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b&&JSON.stringify(b)}).then(async r=>{const j=await r.json();if(r.status==401&&u!='/api/login'){showLogin();throw new Error('login')}if(!r.ok)throw new Error(j.error);return j});
const TABS={o:'Pesanan',m:'Menu',t:'Meja & QR',k:'Keuangan'};let tab='o',os=[],sig='',alarm=0,tm,edit=null;
const err=x=>x.message!='login'&&alert(x.message);
function showLogin(){$('#login').hidden=false;clearInterval(tm);sfx.alarm(0);alarm=0;$('#app').hidden=true;$('#hd').hidden=true;$('#login').hidden=false}
async function login(ev){ev.preventDefault();const b=$('#lb');b.disabled=true;$('#er').textContent='';try{await api('/api/login','POST',{password:$('#pw').value.trim()});$('#pw').value='';start()}catch(x){$('#er').textContent=x.message=='Failed to fetch'?'Tidak bisa terhubung ke server.':x.message;const l=$('#lf');l.classList.remove('sk');void l.offsetWidth;l.classList.add('sk');$('#pw').select()}b.disabled=false;return false}
$('#eye').onclick=()=>{const p=$('#pw');p.type=p.type=='password'?'text':'password';$('#eye').textContent=p.type=='text'?'Sembunyi':'Lihat'};
async function out(){await api('/api/logout','POST',{});showLogin()}
function start(){$('#login').hidden=true;$('#app').hidden=false;$('#hd').hidden=false;bellR();go(tab);clearInterval(tm);tm=setInterval(poll,4000)}
const bellR=()=>$('#bell').textContent=sfx.on()?'Suara aktif':'Suara mati';
$('#bell').onclick=()=>{sfx.toggle();bellR()};
function nav(){const w=os.filter(o=>o.status=='waiting').length;$('#nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${v}${k=='o'&&w?`<em>${w}</em>`:''}</button>`).join('')}
const stg=()=>{stag($('#pane'));document.querySelectorAll('#pane .cols,#pane .kps').forEach(stag)};
const stag=el=>[...el.children].forEach((c,i)=>c.style.setProperty('--i',Math.min(i,14)));
async function go(k){tab=k;sig=JSON.stringify(os);nav();await({o:ordersR,m:menuR,t:tablesR,k:moneyR})[k]();stg()}
async function poll(){try{os=await api('/api/admin/orders');const w=os.some(o=>o.status=='waiting');if(w!=alarm){alarm=w;sfx.alarm(w?1:0)}nav();const n=JSON.stringify(os);if(tab=='o'&&n!=sig){sig=n;ordersR();stg()}}catch{}}
function card(o){const st={waiting:['Perlu konfirmasi','w'],paid:['Sedang dibuat',''],done:['Selesai',''],cancelled:['Dibatalkan','x']}[o.status];
 return `<div class="card"><div class="row"><b class="fl">#${o.id} · Meja ${o.table_number}</b><span class="tag ${st[1]}">${st[0]}</span></div><div class="mu">${hm(o.created_at)} · ${o.method=='cash'?'Tunai':'QRIS'}</div>
 <div style="margin:10px 0">${o.items.map(i=>`<div>${i.qty}× ${e(i.name)}</div>`).join('')}${o.note?`<div class="mu">Catatan: ${e(o.note)}</div>`:''}</div>
 ${o.soldOut?.length&&o.status=='waiting'?`<p class="out" style="font-size:13px">Stok habis: ${o.soldOut.map(e).join(', ')}</p>`:''}
 <div class="row"><b class="fl">${f(o.total)}</b>${o.status=='waiting'?`<button class="s" onclick="act(${o.id},'confirm')">Terima pembayaran</button>`:''}${o.status=='paid'?`<button class="s" onclick="act(${o.id},'done')">Tandai selesai</button>`:''}${['waiting','paid'].includes(o.status)?`<button class="r s" onclick="act(${o.id},'cancel',1)">Batalkan</button>`:''}</div></div>`}
function ordersR(){const now=new Date().toDateString(),td=os.filter(o=>new Date(o.created_at).toDateString()==now),ok=td.filter(o=>['paid','done'].includes(o.status)),cnt={};ok.forEach(o=>o.items.forEach(i=>cnt[i.name]=(cnt[i.name]||0)+i.qty));const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
 const K=[['🧾','Pesanan hari ini',td.length],['💰','Omzet hari ini',f(ok.reduce((a,o)=>a+o.total,0))],['🔥','Terlaris',top?`${top[0]} (${top[1]})`:'Belum ada'],['⏳','Perlu konfirmasi',os.filter(o=>o.status=='waiting').length]];
 const g=(s,t)=>{const l=os.filter(o=>s.includes(o.status));return l.length?`<h3 class="sec">${t}</h3><div class="cols">${l.slice(0,s.includes('done')?15:99).map(card).join('')}</div>`:''};
 const body=g(['waiting'],'Perlu konfirmasi')+g(['paid'],'Sedang dibuat')+g(['done','cancelled'],'Riwayat');
 $('#pane').innerHTML=`<div class="kps">${K.map(k=>`<div class="kp"><i>${k[0]}</i><b>${e(k[2])}</b><span>${k[1]}</span></div>`).join('')}</div>`+(body||'<div class="es"><div class="sb">☕</div><h2>Lagi santai, belum ada pesanan</h2><p class="mu">Pesanan baru muncul di sini dan alarm akan berbunyi.</p><div class="tips"><span>📱 Cetak QR di tab Meja &amp; QR</span><span>🔔 Aktifkan suara di pojok atas</span><span>🍰 Atur stok di tab Menu</span></div></div>')}
async function act(id,a,c){if(c&&!confirm('Batalkan pesanan ini?'))return;try{await api(`/api/admin/orders/${id}/${a}`,'POST',{});if(a=='confirm')sfx.play('success');poll()}catch(x){err(x)}}
async function menuR(){const d=await api('/api/admin/categories');window.CT=d.categories;
 $('#pane').innerHTML=`<div class="row" style="margin-bottom:8px"><input class="fl" id="nc" placeholder="Nama kategori baru"><button onclick="addC()">Tambah kategori</button></div>`+d.categories.map(c=>`<h3 class="sec row"><span class="fl">${e(c.name)}</span><button class="g s" onclick="mdlg(null,${c.id})">Tambah menu</button><button class="r s" onclick="delC(${c.id})">Hapus</button></h3>`+d.items.filter(i=>i.category_id==c.id).map(i=>`<div class="item${i.available?'':' off'}"><div class="em">${i.emoji}</div><div class="nm"><b>${e(i.name)}</b><span>${f(i.price)}</span></div><button class="g s" onclick="tog(${i.id})">${i.available?'Tersedia':'Habis'}</button><button class="g s" onclick='mdlg(${JSON.stringify(i).replace(/'/g,"&#39;")})'>Ubah</button><button class="r s" onclick="delM(${i.id})">Hapus</button></div>`).join('')).join('')+(d.categories.length?'':'<div class="es"><div class="sb">📋</div><h2>Menu masih kosong</h2><p class="mu">Buat kategori pertama di atas, lalu tambahkan menunya.</p></div>')}
async function addC(){try{await api('/api/admin/categories','POST',{name:$('#nc').value});menuR()}catch(x){err(x)}}
async function delC(id){if(confirm('Hapus kategori beserta semua menunya?')){await api('/api/admin/categories/'+id,'DELETE');menuR()}}
async function tog(id){await api(`/api/admin/menu/${id}/toggle`,'POST',{});menuR()}
async function delM(id){if(confirm('Hapus menu ini?')){await api('/api/admin/menu/'+id,'DELETE');menuR()}}
function mdlg(i,c){edit=i;$('#dt').textContent=i?'Ubah menu':'Menu baru';$('#mn').value=i?.name||'';$('#mp').value=i?.price??'';$('#me').value=i?.emoji||'🍽️';$('#mc').innerHTML=CT.map(x=>`<option value="${x.id}">${e(x.name)}</option>`).join('');$('#mc').value=i?.category_id||c;$('#dlg').showModal()}
async function saveM(){const b={name:$('#mn').value,price:+$('#mp').value,emoji:$('#me').value,category_id:+$('#mc').value};try{await(edit?api('/api/admin/menu/'+edit.id,'PUT',b):api('/api/admin/menu','POST',b));$('#dlg').close();menuR()}catch(x){err(x)}}
async function tablesR(){const t=await api('/api/admin/tables');
 $('#pane').innerHTML=`<div class="row noprint"><input id="tnum" type="number" min="1" placeholder="Nomor meja (kosong = otomatis)" style="max-width:260px"><button onclick="addT()">Tambah meja</button><button class="g" onclick="print()">Cetak semua QR</button></div><h3 class="sec">Meja</h3><div class="cols">${t.map(x=>`<div class="card qr"><h3 style="font-size:24px">Meja ${x.number}</h3><img src="/api/qr/${x.number}" alt="QR meja ${x.number}"><div class="noprint"><button class="r s" onclick="delT(${x.id})">Hapus</button></div></div>`).join('')}</div>${t.length?'':'<div class="es"><div class="sb">🪑</div><h2>Belum ada meja</h2><p class="mu">Tambah meja untuk membuat QR pemesanan.</p></div>'}`}
async function addT(){try{await api('/api/admin/tables','POST',{number:+$('#tnum').value});tablesR()}catch(x){err(x)}}
async function delT(id){if(confirm('Hapus meja ini?')){await api('/api/admin/tables/'+id,'DELETE');tablesR()}}
async function moneyR(){const [d,q]=await Promise.all([api('/api/admin/finance'),api('/api/qris')]);
 $('#pane').innerHTML=`<div class="card"><h3 style="font-size:22px">Catat pengeluaran</h3><div class="row"><input class="fl" id="ea" type="number" min="1" placeholder="Jumlah (Rp)"><input class="fl" id="en" placeholder="Keterangan, mis. beli susu"><button onclick="addE()">Simpan</button></div></div>
 <div class="card"><h3 style="font-size:22px">Gambar QRIS</h3>${q.image?`<img src="${q.image}" alt="QRIS" style="width:160px;display:block;margin:8px 0">`:'<p class="mu">Belum ada. Pelanggan hanya bisa bayar tunai.</p>'}<div class="row"><input type="file" id="qf" accept="image/*" class="fl"><button onclick="upQ()">Unggah</button>${q.image?'<button class="r" onclick="delQ()">Hapus</button>':''}</div></div>
 ${d.map(x=>`<h3 class="sec">${new Date(x.date+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})}</h3><div class="card"><div class="row"><div class="fl"><div class="mu">Masuk</div><div class="big in">${f(x.income)}</div></div><div class="fl"><div class="mu">Keluar</div><div class="big out">${f(x.expense)}</div></div><div class="fl"><div class="mu">Bersih</div><div class="big">${f(x.income-x.expense)}</div></div></div>${x.tx.map(t=>`<div class="ln"><span class="mu">${hm(t.created_at)}</span><span>${e(t.note)}</span><b class="${t.type=='in'?'in':'out'}">${t.type=='in'?'+':'−'}${f(t.amount)}</b>${t.type=='out'?`<button class="r s" onclick="delX(${t.id})">Hapus</button>`:''}</div>`).join('')||'<p class="mu" style="margin-top:8px">Belum ada transaksi.</p>'}</div>`).join('')}`}
async function addE(){try{await api('/api/admin/expense','POST',{amount:+$('#ea').value,note:$('#en').value});moneyR()}catch(x){err(x)}}
async function delX(id){await api('/api/admin/tx/'+id,'DELETE');moneyR()}
function upQ(){const fl=$('#qf').files[0];if(!fl)return alert('Pilih gambar dulu');const r=new FileReader();r.onload=async()=>{try{await api('/api/admin/qris','PUT',{image:r.result});moneyR()}catch(x){err(x)}};r.readAsDataURL(fl)}
async function delQ(){await api('/api/admin/qris','DELETE');moneyR()}
api('/api/admin/me').then(start).catch(showLogin);
</script></body></html>
